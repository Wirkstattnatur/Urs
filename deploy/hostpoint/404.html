<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden — Wirkstattnatur</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f2eee5; color: #183b2d; }
      main { width: min(38rem, 100%); padding: clamp(2rem, 6vw, 4rem); border-radius: 1.5rem; background: #294f3d; color: #fffdf7; }
      p { margin: 0 0 1rem; line-height: 1.65; }
      h1 { margin: 0 0 1rem; font-family: Georgia, serif; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; }
      a { display: inline-flex; margin-top: 1rem; border-radius: 999px; padding: .85rem 1.2rem; background: #c8e94a; color: #183b2d; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fffdf7; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>Fehler 404</p>
      <h1>Diese Seite gibt es nicht</h1>
      <p>Vielleicht wurde die Adresse geändert oder der Link ist nicht mehr aktuell.</p>
      <a href="/">Zur Startseite</a>
    </main>
  </body>
</html>
